<svg xmlns="http://www.w3.org/2000/svg" width="580" height="400" viewBox="0 0 580 400" role="img" aria-labelledby="title desc">
  <title id="title">An insert request inside a PRIMARY-index gap</title>
  <desc id="desc">MySQL 8.4.11 InnoDB, REPEATABLE READ. A scans bookings.slot BETWEEN 10 AND 20 FOR UPDATE. Existing PRIMARY keys are 10, 20, 30. B inserts 15 in the open interval between 10 and 20 and waits until A commits. The waiting mode is X,GAP,INSERT_INTENTION. This is a relevant-interval teaching model, not the full lock footprint.</desc>
  <rect width="580" height="400" rx="10" fill="#f6f7f9"/>
  <g font-family="sans-serif" fill="#172c40">
    <text x="24" y="34" font-size="20" font-weight="bold">InnoDB PRIMARY index: bookings.slot</text>
    <text x="24" y="62" font-size="16">MySQL 8.4.11, REPEATABLE READ</text>
    <text x="24" y="92" font-size="16">A: BETWEEN 10 AND 20 FOR UPDATE</text>
    <rect x="90" y="132" width="200" height="62" fill="#dbe9fb" stroke="#2f609d"/>
    <path d="M 50 163 H 525" stroke="#172c40" stroke-width="2"/>
    <g fill="#172c40">
      <circle cx="90" cy="163" r="7"/><circle cx="290" cy="163" r="7"/><circle cx="490" cy="163" r="7"/>
    </g>
    <g font-size="18" text-anchor="middle">
      <text x="90" y="120">10</text><text x="290" y="120">20</text><text x="490" y="120">30</text>
      <text x="190" y="218">gap (10, 20)</text>
    </g>
    <path d="M 190 275 V 182 l -6 10 m 6 -10 l 6 10" fill="none" stroke="#9d5100" stroke-width="3"/>
    <text x="24" y="304" font-size="17" font-weight="bold">B: INSERT slot 15, no existing row at 15</text>
    <text x="24" y="332" font-size="16">Waits: X,GAP,INSERT_INTENTION</text>
    <text x="24" y="360" font-size="16">A's COMMIT releases the conflicting protection.</text>
    <text x="24" y="385" font-size="14">Relevant interval only; not A's complete lock footprint.</text>
  </g>
</svg>
