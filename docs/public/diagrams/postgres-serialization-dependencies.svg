<svg xmlns="http://www.w3.org/2000/svg" width="580" height="380" viewBox="0 0 580 380" role="img" aria-labelledby="title desc">
  <title id="title">PostgreSQL on-call logical ordering dependencies</title>
  <desc id="desc">Dashed reader-to-writer edges show logical ordering, not waits. A reads Bob on call before B removes Bob, requiring A before B. B reads Alice on call before A removes Alice, requiring B before A. There is no serial order satisfying both. This is a teaching model, not the complete SSI detection algorithm or a captured predicate-lock graph.</desc>
  <defs>
    <marker id="dependency" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 8 5 L 0 10" fill="none" stroke="#6b3989" stroke-width="2"/></marker>
  </defs>
  <rect width="580" height="380" rx="10" fill="#f6f7f9"/>
  <g font-family="sans-serif" fill="#172c40">
    <text x="24" y="34" font-size="20" font-weight="bold">PostgreSQL: logical dependencies</text>
    <text x="24" y="62" font-size="16">On-call schedule, SERIALIZABLE, PostgreSQL 18.6</text>
    <rect x="35" y="150" width="200" height="86" rx="6" fill="#dbe9fb" stroke="#2f609d"/>
    <rect x="345" y="150" width="200" height="86" rx="6" fill="#fff0dc" stroke="#9d5100"/>
    <g font-size="17" text-anchor="middle">
      <text x="135" y="177" font-weight="bold">A</text>
      <text x="135" y="201">Reads Bob on call</text>
      <text x="135" y="225">Removes Alice</text>
      <text x="445" y="177" font-weight="bold">B</text>
      <text x="445" y="201">Reads Alice on call</text>
      <text x="445" y="225">Removes Bob</text>
    </g>
    <path d="M 135 150 V 120 H 445 V 145" fill="none" stroke="#6b3989" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#dependency)"/>
    <path d="M 445 236 V 266 H 135 V 241" fill="none" stroke="#6b3989" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#dependency)"/>
    <text x="290" y="106" text-anchor="middle" font-size="16">A before B: A did not see B's removal</text>
    <text x="290" y="291" text-anchor="middle" font-size="16">B before A: B did not see A's removal</text>
    <text x="24" y="326" font-size="16">Dashed open arrow: reader to later logical writer.</text>
    <text x="24" y="350" font-size="16">An ordering requirement, not a blocked statement.</text>
    <text x="24" y="373" font-size="14">Teaching model only; not the complete SSI algorithm.</text>
  </g>
</svg>
