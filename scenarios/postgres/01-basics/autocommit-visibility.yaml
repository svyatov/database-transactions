title: Autocommit and READ COMMITTED visibility
claim: >-
  B sees A's successful autocommit UPDATE in its next plain SELECT at READ COMMITTED; an explicit transaction's UPDATE becomes visible to B only after COMMIT.
setup: |
  CREATE TABLE accounts (id int PRIMARY KEY, owner text NOT NULL, balance int NOT NULL);
  INSERT INTO accounts VALUES (1, 'alice', 100);
sessions: [A, B]
steps:
  - note: "No BEGIN: this successful UPDATE commits as its own transaction before the next SELECT."
  - A: UPDATE accounts SET balance = 150 WHERE id = 1
    tl: UPDATE balance = 150 (autocommit, committed at once)

  - B: SELECT balance FROM accounts WHERE id = 1
    expect: [{ balance: 150 }]
    comment: B sees it immediately
    tl: SELECT → 150 ← visible right away

  - note: Inside an explicit transaction, A's change is invisible to B…
  - A: BEGIN ISOLATION LEVEL READ COMMITTED
  - A: UPDATE accounts SET balance = 999 WHERE id = 1
    tl: UPDATE balance = 999 (uncommitted)

  - B: SELECT balance FROM accounts WHERE id = 1
    expect: [{ balance: 150 }]
    comment: still the old value
    tl: SELECT → 150 ← still the old value

  - note: …until A commits.
  - A: COMMIT
    tl: COMMIT

  - B: SELECT balance FROM accounts WHERE id = 1
    expect: [{ balance: 999 }]
    tl: SELECT → 999 ← now B sees it

  - note: A failed autocommit statement does not leave the next statement in a failed transaction.
  - A.fails: SELECT 1 / 0
    error: "22012"
  - A: SELECT 1 AS recovered
    expect: [{ recovered: 1 }]
