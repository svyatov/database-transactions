title: Statement error leaves an explicit transaction failed
claim: >-
  After division by zero in this explicit transaction, SELECT fails with 25P02; ROLLBACK ends the failed transaction and a new SELECT succeeds. In the second transaction, COMMIT after the error rolls back the preceding INSERT.
setup: |
  CREATE TABLE samples (n int PRIMARY KEY);
sessions: [A]
steps:
  - A: BEGIN ISOLATION LEVEL READ COMMITTED

  - A.fails: SELECT 1 / 0
    error: "22012"
    comment: division_by_zero

  - note: The transaction is now aborted. Even a perfectly innocent statement is refused.
  - A.fails: SELECT 1 AS innocent
    error: "25P02"
    comment: in_failed_sql_transaction

  - note: This first transaction uses full ROLLBACK. The next transaction checks COMMIT after an error; savepoint recovery has its own Scenario.
  - A: ROLLBACK

  - A: SELECT 1 AS innocent
    expect: [{ innocent: 1 }]

  - A: BEGIN ISOLATION LEVEL READ COMMITTED
  - A: INSERT INTO samples VALUES (1)
    affected: 1
  - A.fails: SELECT 1 / 0
    error: "22012"
  - A: COMMIT
    comment: a failed transaction ends by rolling back, even when COMMIT is sent
  - A: SELECT count(*)::int AS remaining FROM samples
    expect: [{ remaining: 0 }]
