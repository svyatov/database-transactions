title: A hung worker turns queue throughput into disk
claim: >-
  In this READ COMMITTED schedule on an 8 KiB-page heap, A holds a row lock and
  an assigned transaction ID while B completes 1001 jobs. The heap grows from
  9 to 17 pages with 1200 rows; VACUUM leaves 2201 occupied line pointers while
  A is open. After A commits, another VACUUM reduces that count to 1200,
  without reducing the 17-page file.
setup: |
  CREATE EXTENSION pageinspect;
  CREATE TABLE jobs (id int PRIMARY KEY, task text NOT NULL, state text NOT NULL DEFAULT 'queued');
  INSERT INTO jobs (id, task) SELECT g, 'send welcome email' FROM generate_series(1, 1200) g;
  CREATE PROCEDURE drain(n int) LANGUAGE plpgsql AS $$
  DECLARE j int;
  BEGIN
    FOR i IN 1..n LOOP
      SELECT id INTO j FROM jobs WHERE state = 'queued'
        ORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED;
      EXIT WHEN j IS NULL;
      UPDATE jobs SET state = 'done' WHERE id = j;
      COMMIT;
    END LOOP;
  END $$;
sessions: [A, B]
steps:
  - note: >-
      A is a worker that claims a job and then hangs: the connection stays open and the
      transaction never commits. This is the queue's own flavor of "idle in transaction."
  - A: BEGIN
  - A: |-
      SELECT id, task FROM jobs WHERE state = 'queued'
      ORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED
    expect: [{ id: 1 }]
    tl: A claims job 1, then hangs

  - B: |
      SELECT backend_xid IS NOT NULL AS has_xid
      FROM pg_stat_activity WHERE application_name = 'A'
    expect: [{ has_xid: true }]
    comment: A retains an assigned xid; READ COMMITTED does not establish a transaction-wide RR snapshot

  - note: >-
      The queue is 1200 rows in 9 pages, and it keeps humming while A sits there. B is a
      worker using the chapter 5 selection predicate and completion update.
      B skips A's locked job 1 and claims job 2.
  - B: SELECT (pg_relation_size('jobs') / 8192)::int AS pages
    expect: [{ pages: 9 }]
    tl: 9 pages
  - B: BEGIN
  - B: |-
      SELECT id, task FROM jobs WHERE state = 'queued'
      ORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED
    expect: [{ id: 2 }]
    comment: job 1 is claimed by A, skipped without waiting
    tl: B claims job 2 (skips A's job 1)
  - B: UPDATE jobs SET state = 'done' WHERE id = 2
    affected: 1
    tl: job 2 completion update
  - B: COMMIT
    tl: COMMIT

  - note: >-
      B runs the same selection and completion body a thousand more times.
      drain(n) commits each cycle, so CALL runs outside a transaction block.
      Task names are data: no email is sent in this Scenario.
  - B: CALL drain(250)
    comment: 250 more claim/complete cycles
    tl: drain 250
  - B: SELECT (pg_relation_size('jobs') / 8192)::int AS pages
    expect: [{ pages: 11 }]
    tl: 9 → 11 pages
  - B: CALL drain(750)
    comment: 750 more
    tl: drain 750
  - B: SELECT (pg_relation_size('jobs') / 8192)::int AS pages
    expect: [{ pages: 17 }]
    tl: 11 → 17 pages

  - B: |
      SELECT count(*)::int AS jobs,
             count(*) FILTER (WHERE state = 'done')::int AS done,
             count(*) FILTER (WHERE state = 'queued')::int AS queued
      FROM jobs
    expect: [{ jobs: 1200, done: 1001, queued: 199 }]

  - note: >-
      There are 1200 current rows and 1001 additional occupied tuple slots.
      † The horizon explanation is an inference from PostgreSQL 18's
      old-transaction vacuum guidance, linked in the lesson. READ COMMITTED
      does not give A a transaction-wide RR snapshot or access to every old version.
  - B: |-
      SELECT count(*)::int AS occupied
      FROM generate_series(0, (pg_relation_size('jobs') / 8192)::int - 1) AS p,
           heap_page_items(get_raw_page('jobs', p::int))
      WHERE lp_flags = 1
    expect: [{ occupied: 2201 }]
    tl: 2201 occupied tuple slots

  - B: VACUUM jobs
    tl: VACUUM, while A still hangs
  - note: >-
      VACUUM completed, but the occupied line-pointer count did not fall.
      This measurement does not prove that VACUUM did no other maintenance.
  - B: |-
      SELECT count(*)::int AS occupied
      FROM generate_series(0, (pg_relation_size('jobs') / 8192)::int - 1) AS p,
           heap_page_items(get_raw_page('jobs', p::int))
      WHERE lp_flags = 1
    expect: [{ occupied: 2201 }]
    tl: still 2201 occupied tuple slots

  - A: COMMIT
    tl: A finally commits, the hang ends
  - note: >-
      After A commits, a second VACUUM reduces occupied tuple slots to 1200.
      Commit alone does not perform that cleanup.
  - B: VACUUM jobs
    tl: same VACUUM, a moment later
  - B: |-
      SELECT count(*)::int AS occupied
      FROM generate_series(0, (pg_relation_size('jobs') / 8192)::int - 1) AS p,
           heap_page_items(get_raw_page('jobs', p::int))
      WHERE lp_flags = 1
    expect: [{ occupied: 1200 }]
    tl: 2201 → 1200, reclaimed

  - note: >-
      The heap file stays at 17 pages in this run. Ordinary VACUUM can truncate
      entirely empty trailing pages under suitable locking conditions, but does
      not compact live rows. VACUUM FULL and other table rewrites are separate
      operations, not executed here. File size alone does not measure reusable space.
  - B: SELECT (pg_relation_size('jobs') / 8192)::int AS pages
    expect: [{ pages: 17 }]
    tl: heap file still 17 pages
