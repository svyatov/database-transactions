title: FOR UPDATE permits an ordinary read while a conflicting UPDATE waits
claim: >-
  In this Read Committed schedule B's ordinary SELECT reads 100 while A
  holds FOR UPDATE; B's UPDATE waits, then uses A's committed 150 to leave
  140. Locking reads can conflict; table-lock waits are not excluded.
setup: |
  CREATE TABLE accounts (id int PRIMARY KEY, owner text NOT NULL, balance int NOT NULL);
  INSERT INTO accounts VALUES (1, 'alice', 100);
sessions: [A, B]
steps:
  - A: BEGIN
  - A: SELECT * FROM accounts WHERE id = 1 FOR UPDATE
    tl: SELECT … FOR UPDATE (locks the row)

  - note: B's ordinary SELECT reads the row without a conflicting row-lock request; cost is not measured.
  - B: SELECT balance FROM accounts WHERE id = 1
    expect: [{ balance: 100 }]
    tl: ordinary SELECT → 100

  - note: >-
      Writing to it is another story: B's UPDATE must wait for A.
  - B: UPDATE accounts SET balance = balance - 10 WHERE id = 1
    blocks: p1
    tl: UPDATE -10

  - A: UPDATE accounts SET balance = 150 WHERE id = 1
  - A: COMMIT
    comment: releases the row lock
    tl: COMMIT (releases the lock)

  - success: p1
  - B: SELECT balance FROM accounts WHERE id = 1
    expect: [{ balance: 140 }]
    comment: B's -10 applied on top of A's committed 150
