title: "lock_timeout: wait, but not forever"
claim: >-
  B's standalone UPDATE fails with 55P03 under a 100ms lock_timeout while
  A holds the row lock. After A commits, B retries successfully and reads
  300. lock_timeout limits each acquisition, not total statement time.
setup: |
  CREATE TABLE accounts (id int PRIMARY KEY, owner text NOT NULL, balance int NOT NULL);
  INSERT INTO accounts VALUES (1, 'alice', 100);
sessions: [A, B]
steps:
  - A: BEGIN
  - A: UPDATE accounts SET balance = 200 WHERE id = 1
    tl: UPDATE 200 (locks row 1)

  - B: SET lock_timeout = '100ms'
  - note: B queues for the row lock like anyone else — but gives up after 100ms.
  - B.fails: UPDATE accounts SET balance = 300 WHERE id = 1
    error: "55P03"
    comment: lock_not_available, raised after the timeout
    tl: UPDATE 300 → gives up after 100ms

  - note: B's failed standalone statement ends its implicit transaction; a fresh attempt after A commits works here.
  - A: COMMIT
    tl: COMMIT
  - B: UPDATE accounts SET balance = 300 WHERE id = 1
    tl: UPDATE 300 (retry succeeds)
  - B: SELECT balance FROM accounts WHERE id = 1
    expect: [{ balance: 300 }]
