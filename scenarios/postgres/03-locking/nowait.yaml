title: "NOWAIT: fail fast instead of queueing"
claim: >-
  B's FOR UPDATE NOWAIT gets 55P03 while A holds a conflicting row lock;
  after A commits, B's standalone retry returns row 1. NOWAIT concerns
  row locks and does not eliminate table-lock waits or other errors.
setup: |
  CREATE TABLE accounts (id int PRIMARY KEY, owner text NOT NULL, balance int NOT NULL);
  INSERT INTO accounts VALUES (1, 'alice', 100);
sessions: [A, B]
steps:
  - A: BEGIN
  - A: SELECT id FROM accounts WHERE id = 1 FOR UPDATE
    tl: SELECT … FOR UPDATE (locks row 1)

  - B.fails: SELECT id FROM accounts WHERE id = 1 FOR UPDATE NOWAIT
    error: "55P03"
    comment: lock_not_available from the conflicting row-lock request
    tl: … FOR UPDATE NOWAIT

  - note: Once A is done, the same statement succeeds.
  - A: COMMIT
    tl: COMMIT (releases the lock)
  - B: SELECT id FROM accounts WHERE id = 1 FOR UPDATE NOWAIT
    expect: [{ id: 1 }]
    tl: … NOWAIT → row 1
