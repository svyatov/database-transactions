title: "The fix: run DDL with a lock_timeout"
claim: >-
  B's standalone ALTER waits for a lock and fails with 55P03 under a 100ms
  lock_timeout. C reads successfully after that request leaves the queue;
  B's retry after A commits adds the column.
setup: |
  CREATE TABLE accounts (id int PRIMARY KEY, owner text NOT NULL, balance int NOT NULL);
  INSERT INTO accounts VALUES (1, 'alice', 100);
sessions: [A, B, C]
steps:
  - A: BEGIN
  - A: SELECT balance FROM accounts WHERE id = 1
    comment: the same long transaction as before
    tl: SELECT (long-lived txn) → holds ACCESS SHARE

  - note: Same migration — but this time it gives up after 100ms instead of camping in the queue.
  - B: SET lock_timeout = '100ms'
  - B.fails: ALTER TABLE accounts ADD COLUMN note text
    error: "55P03"
    tl: ALTER TABLE … → gives up after 100ms

  - note: >-
      After B's timeout removes its request, C's read returns 100. No read during B's wait is tested.
  - C: SELECT balance FROM accounts WHERE id = 1
    expect: [{ balance: 100 }]
    tl: SELECT after ALTER timeout → 100

  - A: COMMIT
    tl: COMMIT
  - note: Retry the migration when it can actually get the lock — now it sails through.
  - B: ALTER TABLE accounts ADD COLUMN note text
    tl: ALTER TABLE … (retry completes)
  - C: SELECT column_name FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'accounts' AND column_name = 'note'
    expect: [{ column_name: note }]
