title: Vacuum health at a glance
claim: >-
  After five inserts and three updates, pg_stat_user_tables reports estimated
  live/dead counts 5/3; after manual VACUUM it reports 5/0 and a last_vacuum
  timestamp. The database xid age is below the configured freeze-launch threshold,
  not a demonstrated wraparound safety guarantee.
setup: |
  CREATE TABLE inventory (id int PRIMARY KEY, qty int NOT NULL);
sessions: [A, M]
steps:
  - A: INSERT INTO inventory SELECT g, 10 FROM generate_series(1, 5) g
    affected: 5
  - A: UPDATE inventory SET qty = qty + 1 WHERE id <= 3
    affected: 3
  - A: SELECT pg_stat_force_next_flush()
    comment: stats reach the views lazily; force it for the demo

  - note: "These are statistics estimates, not an exact heap scan. The small run reports five live and three dead rows:"
  - M: |
      SELECT relname, n_live_tup::int, n_dead_tup::int, last_vacuum IS NULL AS no_vacuum_timestamp
      FROM pg_stat_user_tables WHERE relname = 'inventory'
    expect: [{ relname: inventory, n_live_tup: 5, n_dead_tup: 3, no_vacuum_timestamp: true }]

  - note: "After manual VACUUM, the estimate is zero dead rows and last_vacuum is present:"
  - A: VACUUM inventory
  - M: |
      SELECT relname, n_live_tup::int, n_dead_tup::int, last_vacuum IS NOT NULL AS has_vacuum_timestamp
      FROM pg_stat_user_tables WHERE relname = 'inventory'
    expect: [{ relname: inventory, n_live_tup: 5, n_dead_tup: 0, has_vacuum_timestamp: true }]

  - note: "Compare database xid age with the configured autovacuum freeze-launch threshold. Below it is not proof that freezing will finish in time:"
  - M: |
      SELECT age(datfrozenxid) < current_setting('autovacuum_freeze_max_age')::int AS below_freeze_threshold
      FROM pg_database WHERE datname = current_database()
    expect: [{ below_freeze_threshold: true }]
