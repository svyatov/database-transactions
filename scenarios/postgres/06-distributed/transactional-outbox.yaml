title: The transactional outbox
claim: >-
  The order and outbox row commit or roll back together in the shown
  transactions. A relay's rolled-back delete leaves the row selectable
  again; a committed delete empties the outbox. Publication is not executed.
setup: |
  CREATE TABLE orders (id int PRIMARY KEY, customer text NOT NULL, amount int NOT NULL);
  CREATE TABLE outbox (id int GENERATED ALWAYS AS IDENTITY PRIMARY KEY, event text NOT NULL);
sessions: [App, Relay]
steps:
  - note: The order and its event are written in ONE transaction — both land in the same database.
  - App: BEGIN
  - App: INSERT INTO orders VALUES (1, 'alice', 90)
  - App: "INSERT INTO outbox (event) VALUES ('order_placed: order 1')"
  - App: COMMIT

  - note: "Atomicity covers the failure path too: no committed order, no event."
  - App: BEGIN
  - App: INSERT INTO orders VALUES (2, 'bob', 75)
  - App: "INSERT INTO outbox (event) VALUES ('order_placed: order 2')"
  - App: ROLLBACK
  - App: SELECT id, event FROM outbox ORDER BY id
    expect: [{ id: 1, event: "order_placed: order 1" }]
  - App: SELECT id, customer, amount FROM orders ORDER BY id
    expect: [{ id: 1, customer: "alice", amount: 90 }]

  - note: A relay claims the event exactly like a chapter-5 job-queue worker…
  - Relay: BEGIN
  - Relay: SELECT id, event FROM outbox ORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED
    expect: [{ id: 1, event: "order_placed: order 1" }]

  - note: A real relay would publish outside this transaction. Here publication is narration only; the DELETE is executed and explicitly rolled back.
  - Relay: DELETE FROM outbox WHERE id = 1
  - Relay: ROLLBACK

  - note: >-
      ROLLBACK restored the deleted row. The relay selects it again and commits
      its deletion. No receiver effect or delivery count is recorded here.
  - Relay: BEGIN
  - Relay: SELECT id, event FROM outbox ORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED
    expect: [{ id: 1, event: "order_placed: order 1" }]
  - Relay: DELETE FROM outbox WHERE id = 1
  - Relay: COMMIT

  - Relay: SELECT count(*)::int AS pending FROM outbox
    expect: [{ pending: 0 }]
