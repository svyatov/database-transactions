title: The dual-write problem
claim: >-
  Separate commits in one database model a dual-write boundary: omitting a
  broker-table insert leaves one order without an event; a CHECK failure
  after a broker-table insert leaves one event without its order.
setup: |
  CREATE TABLE orders (id int PRIMARY KEY, customer text NOT NULL, amount int NOT NULL CHECK (amount > 0));
  -- Receiver model in the SAME database, committed separately from the order.
  -- No live broker, transport, consumer, or process crash is exercised.
  CREATE TABLE broker (event text NOT NULL);
sessions: [App]
steps:
  - note: Attempt 1 — write, then publish. The order commits…
  - App: BEGIN
  - App: INSERT INTO orders VALUES (1, 'alice', 90)
  - App: COMMIT
  - note: Publication is deliberately omitted. No process crashes; the broker table has no order-1 event.
  - App: |-
      SELECT (SELECT count(*)::int FROM orders) AS orders,
             (SELECT count(*)::int FROM broker) AS events
    expect: [{ orders: 1, events: 0 }]

  - note: Attempt 2 — publish first, then write. The event goes out…
  - App: "INSERT INTO broker VALUES ('order_placed: order 2')"
  - note: The order INSERT fails its CHECK constraint after the separately committed broker record.
  - App.fails: INSERT INTO orders VALUES (2, 'mallory', -5)
    error: "23514"
    comment: check_violation

  - note: The receiver table has an event without an order. No downstream service is executed.
  - App: |-
      SELECT (SELECT count(*)::int FROM orders WHERE id = 2) AS orders,
             (SELECT count(*)::int FROM broker WHERE event LIKE '%order 2%') AS events
    expect: [{ orders: 0, events: 1 }]
