title: "Fixing lost updates #2: SELECT ... FOR UPDATE"
claim: >-
  At READ COMMITTED, both writers lock before reading and update within the
  same transaction. B waits and reads A's committed 110; the final balance
  is 120. Other writer protocols and external effects are not tested.
setup: |
  CREATE TABLE accounts (id int PRIMARY KEY, owner text NOT NULL, balance int NOT NULL);
  INSERT INTO accounts VALUES (1, 'alice', 100);
sessions: [A, B]
steps:
  - note: The app must apply business rules to the balance in code — so it locks the row while it reads.
  - A: BEGIN
  - A: SELECT balance FROM accounts WHERE id = 1 FOR UPDATE
    expect: [{ balance: 100 }]
    capture: a

  - B: BEGIN
  - B: SELECT balance FROM accounts WHERE id = 1 FOR UPDATE
    blocks: p1

  - A: UPDATE accounts SET balance = ${a.balance} + 10 WHERE id = 1
  - A: COMMIT

  - note: B's locking read waited for A's transaction. The next assertion checks that it returns 110.
  - success: p1
    expect: [{ balance: 110 }]
    capture: b
  - B: UPDATE accounts SET balance = ${b.balance} + 10 WHERE id = 1
  - B: COMMIT

  - A: SELECT balance FROM accounts WHERE id = 1
    expect: [{ balance: 120 }]
    comment: both deposits survived
