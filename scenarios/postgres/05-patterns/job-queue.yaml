title: A job queue on FOR UPDATE SKIP LOCKED
claim: >-
  At READ COMMITTED, two workers select different available jobs with FOR
  UPDATE SKIP LOCKED. An explicit rollback leaves job 2 queued for selection
  again; both jobs end in state done. No external task execution is tested.
setup: |
  CREATE TABLE jobs (id int PRIMARY KEY, task text NOT NULL, state text NOT NULL DEFAULT 'queued');
  INSERT INTO jobs (id, task) VALUES (1, 'send welcome email'), (2, 'generate invoice');
sessions: [A, B]
steps:
  - note: "Two workers select available queued rows in id order and mark database state done. Task names are data; no email or invoice is executed."
  - A: BEGIN
  - A: |-
      SELECT id, task FROM jobs WHERE state = 'queued'
      ORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED
    expect: [{ id: 1 }]
    tl: claim → job 1

  - B: BEGIN
  - B: |-
      SELECT id, task FROM jobs WHERE state = 'queued'
      ORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED
    expect: [{ id: 2 }]
    comment: job 1 is claimed — skipped without waiting
    tl: claim → job 2 (skips locked job 1)

  - note: A marks job 1 done and commits. B explicitly rolls back; no worker process is killed.
  - A: UPDATE jobs SET state = 'done' WHERE id = 1
    tl: job 1 done
  - A: COMMIT
    tl: COMMIT
  - B: ROLLBACK
    tl: ROLLBACK → job 2 remains queued

  - note: B selects job 2 again after rollback. This checks row availability, not the number of external effects.
  - B: BEGIN
  - B: |-
      SELECT id, task FROM jobs WHERE state = 'queued'
      ORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED
    expect: [{ id: 2 }]
    tl: claim → job 2 (back in queue)
  - B: UPDATE jobs SET state = 'done' WHERE id = 2
    tl: job 2 done
  - B: COMMIT
    tl: COMMIT

  - A: SELECT id, state FROM jobs ORDER BY id
    expect: [{ id: 1, state: "done" }, { id: 2, state: "done" }]
    tl: both jobs done
