title: "Fixing lost updates #3: optimistic locking with a version column"
claim: >-
  At READ COMMITTED, B's stale version predicate affects zero rows. B rolls
  back, rereads, and reapplies its additive deposit; the final balance is
  120 and version 3. Both writers check and advance the version.
setup: |
  CREATE TABLE accounts (
    id int PRIMARY KEY, owner text NOT NULL, balance int NOT NULL, version int NOT NULL DEFAULT 1
  );
  INSERT INTO accounts VALUES (1, 'alice', 100, 1);
sessions: [A, B]
steps:
  - note: Both writers read the row and version without taking a FOR UPDATE row lock. Their transactions still acquire table locks.
  - A: BEGIN
  - A: SELECT balance, version FROM accounts WHERE id = 1
    capture: readA
  - B: BEGIN
  - B: SELECT balance, version FROM accounts WHERE id = 1
    expect: [{ balance: 100, version: 1 }]
    capture: readB

  - note: Every write bumps the version and only matches the version it read.
  - A: |-
      UPDATE accounts SET balance = ${readA.balance} + 10, version = version + 1
      WHERE id = 1 AND version = ${readA.version}
  - A: COMMIT

  - B: |-
      UPDATE accounts SET balance = ${readB.balance} + 10, version = version + 1
      WHERE id = 1 AND version = ${readB.version}
    affected: 0
    comment: UPDATE 0 — the row moved on; B's deposit did NOT silently vanish

  - note: "For this additive deposit, B retries after UPDATE 0. Other applications may need to report or reconsider a stale edit; deletion can also yield zero rows."
  - B: ROLLBACK
  - B: BEGIN
  - B: SELECT balance, version FROM accounts WHERE id = 1
    expect: [{ balance: 110, version: 2 }]
    capture: retry
  - B: |-
      UPDATE accounts SET balance = ${retry.balance} + 10, version = version + 1
      WHERE id = 1 AND version = ${retry.version}
  - B: COMMIT

  - A: SELECT balance, version FROM accounts WHERE id = 1
    expect: [{ balance: 120, version: 3 }]
    comment: both deposits survived
