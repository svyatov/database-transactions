title: REPEATABLE READ rejects a stale deposit, then a fresh retry succeeds
claim: >-
  In this schedule at REPEATABLE READ, B's stale UPDATE fails with 40001 after A commits 110; after ROLLBACK, B reads 110 in a fresh transaction and commits 120.
anomaly: P4
isolation: REPEATABLE READ
setup: |
  CREATE TABLE accounts (id int PRIMARY KEY, owner text NOT NULL, balance int NOT NULL);
  INSERT INTO accounts VALUES (1, 'alice', 100);
sessions: [A, B]
steps:
  - note: The same two +10 deposits — but this time at REPEATABLE READ.
  - A: BEGIN ISOLATION LEVEL REPEATABLE READ
  - A: SELECT balance FROM accounts WHERE id = 1
    capture: readA
    tl: SELECT balance → 100

  - B: BEGIN ISOLATION LEVEL REPEATABLE READ
  - B: SELECT balance FROM accounts WHERE id = 1
    expect: [{ balance: 100 }]
    capture: readB
    tl: SELECT balance → 100 (B's pre-commit snapshot)

  - A: UPDATE accounts SET balance = ${readA.balance} + 10 WHERE id = 1
    tl: UPDATE balance = 100 + 10
  - A: COMMIT
    tl: COMMIT

  - note: >-
      B's snapshot predates A's commit, so B's write is refused instead of
      silently clobbering it.
  - B.fails: UPDATE accounts SET balance = ${readB.balance} + 10 WHERE id = 1
    error: "40001"
    comment: serialization_failure
    tl: UPDATE balance = 100 + 10
  - B: ROLLBACK

  - A: SELECT balance FROM accounts WHERE id = 1
    expect: [{ balance: 110 }]
    comment: only A's deposit has committed so far
    tl: SELECT balance → 110 ← B's deposit has not committed

  - note: Retrying B from scratch reads the fresh 110 and correctly produces 120.

  - B: BEGIN ISOLATION LEVEL REPEATABLE READ
  - B: SELECT balance FROM accounts WHERE id = 1
    expect: [{ balance: 110 }]
    capture: retryB
  - B: UPDATE accounts SET balance = ${retryB.balance} + 10 WHERE id = 1
    affected: 1
  - B: COMMIT
  - A: SELECT balance FROM accounts WHERE id = 1
    expect: [{ balance: 120 }]
    tl: SELECT balance → 120 ← B's fresh retry committed
