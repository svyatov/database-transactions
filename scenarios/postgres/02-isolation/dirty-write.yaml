title: Row locks prevent an uncommitted overwrite
claim: >-
  At READ COMMITTED, B's UPDATE of row 1 waits for A to commit before proceeding; after both transactions update both rows and commit in this order, both final prices are B's.
anomaly: G0
setup: |
  CREATE TABLE items (id int PRIMARY KEY, name text NOT NULL, price int NOT NULL);
  INSERT INTO items VALUES (1, 'mug', 10), (2, 'cap', 20);
sessions: [A, B]
steps:
  - note: >-
      Both batch jobs update the same two rows. A dirty write would overwrite
      a row before its previous writer commits or rolls back; the wait below
      prevents that overwrite in this schedule.
  - A: BEGIN ISOLATION LEVEL READ COMMITTED
  - B: BEGIN ISOLATION LEVEL READ COMMITTED
  - A: UPDATE items SET price = 11 WHERE id = 1
    tl: UPDATE id=1 price=11

  - note: B wants the same row. Even at READ COMMITTED it must wait for A's lock.
  - B: UPDATE items SET price = 12 WHERE id = 1
    blocks: p1
    tl: UPDATE id=1 price=12

  - A: UPDATE items SET price = 21 WHERE id = 2
    tl: UPDATE id=2 price=21
  - A: COMMIT
    comment: releases both row locks
    tl: COMMIT ← locks released, B wakes up
  - success: p1

  - B: UPDATE items SET price = 22 WHERE id = 2
    tl: UPDATE id=2 price=22
  - B: COMMIT
    tl: COMMIT

  - A: SELECT id, price FROM items ORDER BY id
    expect: [{ id: 1, price: 12 }, { id: 2, price: 22 }]
    comment: both final prices are B's in this order
    tl: SELECT → 12, 22 ← both final prices are B's
