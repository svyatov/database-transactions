title: REPEATABLE READ rejects these concurrent committed updates
claim: >-
  A's UPDATE at REPEATABLE READ fails with 40001 when B updates its target row after A's snapshot, both when B has already committed and when A waits for B to commit; when B rolls back instead, A's waiting UPDATE succeeds.
anomaly: P4
isolation: REPEATABLE READ
setup: |
  CREATE TABLE accounts (id int PRIMARY KEY, owner text NOT NULL, balance int NOT NULL);
  INSERT INTO accounts VALUES (1, 'alice', 100);
sessions: [A, B]
steps:
  - A: BEGIN ISOLATION LEVEL REPEATABLE READ
  - A: SELECT balance FROM accounts WHERE id = 1
    expect: [{ balance: 100 }]
    comment: snapshot taken

  - note: >-
      B commits a change. A can keep READING its stale snapshot — but writing
      that row is refused.
  - B: UPDATE accounts SET balance = 150 WHERE id = 1
  - A: SELECT balance FROM accounts WHERE id = 1
    expect: [{ balance: 100 }]
  - A.fails: UPDATE accounts SET balance = 200 WHERE id = 1
    error: "40001"
    comment: serialization_failure — retry the whole transaction
  - A: ROLLBACK

  - note: >-
      If the competing write is NOT yet committed, the outcome is decided
      later: A first waits on the row lock…
  - A: BEGIN ISOLATION LEVEL REPEATABLE READ
  - A: SELECT balance FROM accounts WHERE id = 1
    expect: [{ balance: 150 }]
    comment: snapshot taken
    tl: SELECT (snapshot taken)

  - B: BEGIN ISOLATION LEVEL READ COMMITTED
  - B: UPDATE accounts SET balance = 300 WHERE id = 1
    tl: UPDATE balance = 300 (uncommitted)
  - A: UPDATE accounts SET balance = 999 WHERE id = 1
    blocks: p1
    tl: UPDATE balance = 999

  - note: >-
      A's waiting UPDATE fails with 40001 after B commits. The next schedule
      checks the different outcome when B rolls back.
  - B: COMMIT
    tl: COMMIT
  - failure: p1
    error: "40001"
  - A: ROLLBACK

  - A: BEGIN ISOLATION LEVEL REPEATABLE READ
  - A: SELECT balance FROM accounts WHERE id = 1
    expect: [{ balance: 300 }]
  - B: BEGIN ISOLATION LEVEL READ COMMITTED
  - B: UPDATE accounts SET balance = 400 WHERE id = 1
  - A: UPDATE accounts SET balance = 999 WHERE id = 1
    blocks: p2
  - B: ROLLBACK
  - success: p2
    affected: 1
  - A: COMMIT
  - B: SELECT balance FROM accounts WHERE id = 1
    expect: [{ balance: 999 }]
