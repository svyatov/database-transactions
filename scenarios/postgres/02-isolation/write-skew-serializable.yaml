title: SERIALIZABLE rejects this write-skew schedule
claim: >-
  With both transactions SERIALIZABLE, A commits and B's COMMIT fails with 40001 in this schedule; one doctor remains on call. B's fresh transaction observes one and leaves that doctor on call.
anomaly: G2-item
isolation: SERIALIZABLE
setup: |
  CREATE TABLE doctors (name text PRIMARY KEY, on_call boolean NOT NULL);
  INSERT INTO doctors VALUES ('alice', true), ('bob', true);
sessions: [A, B]
steps:
  - note: Same story, same statements, same order — only the isolation level differs.
  - A: BEGIN ISOLATION LEVEL SERIALIZABLE
  - B: BEGIN ISOLATION LEVEL SERIALIZABLE

  - A: SELECT count(*)::int AS on_call FROM doctors WHERE on_call
    expect: [{ on_call: 2 }]
    tl: on-call count → 2
  - B: SELECT count(*)::int AS on_call FROM doctors WHERE on_call
    expect: [{ on_call: 2 }]
    tl: on-call count → 2
  - A: UPDATE doctors SET on_call = false WHERE name = 'alice'
    tl: alice off call
  - B: UPDATE doctors SET on_call = false WHERE name = 'bob'
    tl: bob off call

  - note: In this schedule A commits and B is rejected. Other schedules can fail at a statement or select a different victim.
  - A: COMMIT
    tl: COMMIT succeeds in this schedule
  - B.fails: COMMIT
    error: "40001"
    comment: serialization_failure
    tl: COMMIT

  - A: SELECT count(*)::int AS on_call FROM doctors WHERE on_call
    expect: [{ on_call: 1 }]
    comment: the invariant survived

  - note: >-
      B now starts a fresh transaction, checks the count again, and keeps
      the remaining doctor on call.

  - B: BEGIN ISOLATION LEVEL SERIALIZABLE
  - B: SELECT count(*)::int AS on_call FROM doctors WHERE on_call
    expect: [{ on_call: 1 }]
  - B: COMMIT
  - A: SELECT name, on_call FROM doctors ORDER BY name
    expect: [{ name: alice, on_call: false }, { name: bob, on_call: true }]
