title: READ UNCOMMITTED does not expose this uncommitted UPDATE
claim: >-
  B accepts the READ UNCOMMITTED setting but its plain SELECT reads the committed 100 rather than A's uncommitted 999, which A later rolls back.
anomaly: G1a
isolation: READ UNCOMMITTED
setup: |
  CREATE TABLE accounts (id int PRIMARY KEY, owner text NOT NULL, balance int NOT NULL);
  INSERT INTO accounts VALUES (1, 'alice', 100);
sessions: [A, B]
steps:
  - A: BEGIN ISOLATION LEVEL READ COMMITTED
  - A: UPDATE accounts SET balance = 999 WHERE id = 1
    tl: UPDATE balance = 999 (uncommitted)

  - note: >-
      B explicitly requests READ UNCOMMITTED — the one level that would permit
      dirty reads.
  - B: BEGIN ISOLATION LEVEL READ UNCOMMITTED
  - B: SELECT current_setting('transaction_isolation') AS isolation
    expect: [{ isolation: "read uncommitted" }]
    comment: the setting is accepted…
    tl: isolation = read uncommitted ← setting accepted
  - B: SELECT balance FROM accounts WHERE id = 1
    expect: [{ balance: 100 }]
    comment: …but A's uncommitted 999 stays invisible
    tl: SELECT → 100 ← A's 999 stays invisible

  - B: COMMIT
  - A: ROLLBACK
