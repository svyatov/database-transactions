title: Write skew with REPEATABLE READ and separate-row updates
claim: >-
  Both REPEATABLE READ transactions read two on-call doctors, update different rows, and commit in this schedule; the final asserted on-call count is zero.
anomaly: G2-item
isolation: REPEATABLE READ
setup: |
  CREATE TABLE doctors (name text PRIMARY KEY, on_call boolean NOT NULL);
  INSERT INTO doctors VALUES ('alice', true), ('bob', true);
sessions: [A, B]
steps:
  - note: >-
      Hospital rule: at least one doctor must stay on call. Alice and Bob both
      want the night off.
  - A: BEGIN ISOLATION LEVEL REPEATABLE READ
  - B: BEGIN ISOLATION LEVEL REPEATABLE READ

  - A: SELECT count(*)::int AS on_call FROM doctors WHERE on_call
    expect: [{ on_call: 2 }]
    comment: '"two of us — safe for me to leave"'
    tl: SELECT on_call → 2 ← "safe for me to leave"
  - B: SELECT count(*)::int AS on_call FROM doctors WHERE on_call
    expect: [{ on_call: 2 }]
    comment: '"two of us — safe for me to leave"'
    tl: SELECT on_call → 2 ← "safe for me to leave"

  - note: Each updates a DIFFERENT row, so there is no write-write conflict to detect.
  - A: UPDATE doctors SET on_call = false WHERE name = 'alice'
    tl: UPDATE alice off-call
  - B: UPDATE doctors SET on_call = false WHERE name = 'bob'
    tl: UPDATE bob off-call (a different row)

  - A: COMMIT
    tl: COMMIT
  - B: COMMIT
    comment: both succeed!
    tl: COMMIT ← both succeed, no conflict to detect

  - A: SELECT count(*)::int AS on_call FROM doctors WHERE on_call
    expect: [{ on_call: 0 }]
    comment: nobody is on call — the invariant is broken
    tl: SELECT on_call → 0 ← invariant broken

  - note: >-
      Both transactions checked their own snapshots, but the final count is
      zero. SERIALIZABLE rejects this schedule; coordinating all writers
      with suitable explicit locks is another approach.
