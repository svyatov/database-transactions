title: "Two row-lock strengths: shared and exclusive"
claim: >-
  On this existing MySQL 8.4 InnoDB PRIMARY record, two FOR SHARE reads
  coexist; an UPDATE waits for FOR SHARE, and FOR SHARE waits for an UPDATE.
  The documented S/X record-lock matrix does not describe gap locks or
  nonlocking consistent reads.
setup: |
  CREATE TABLE accounts (id int PRIMARY KEY, owner varchar(20) NOT NULL, balance int NOT NULL);
  INSERT INTO accounts VALUES (1, 'alice', 100);
sessions: [A, B]
steps:
  - note: Two FOR SHARE locks on the same row coexist happily…
  - A: BEGIN
  - A: SELECT id FROM accounts WHERE id = 1 FOR SHARE
    tl: FOR SHARE (S)
  - B: BEGIN
  - B: SELECT id FROM accounts WHERE id = 1 FOR SHARE
    tl: FOR SHARE (S) — coexists
  - B: COMMIT

  - note: …but a FOR SHARE still blocks a plain UPDATE (which needs an X lock).
  - B: UPDATE accounts SET balance = 200 WHERE id = 1
    blocks: p1
    tl: UPDATE (X) — needs the row
  - A: COMMIT
    tl: COMMIT
  - success: p1

  - note: "An X record lock conflicts with FOR SHARE's S request; this locking reader waits."
  - A: BEGIN
  - A: UPDATE accounts SET balance = 300 WHERE id = 1
    tl: UPDATE (X)
  - B: SELECT id FROM accounts WHERE id = 1 FOR SHARE
    blocks: p2
    tl: FOR SHARE (S) — vs X
  - A: COMMIT
    tl: COMMIT
  - success: p2

  - note: The S/X record-lock contract is documented in the MySQL 8.4 locking manual; gap locks have different compatibility.
