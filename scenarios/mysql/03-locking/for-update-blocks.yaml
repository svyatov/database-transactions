title: SELECT FOR UPDATE blocks an UPDATE, not a consistent SELECT
claim: >-
  At MySQL 8.4 InnoDB REPEATABLE READ, A's FOR UPDATE on an existing PRIMARY
  key does not prevent B's consistent SELECT, but B's UPDATE waits. After A
  commits 150, B's decrement produces 140. Locking readers have different rules.
setup: |
  CREATE TABLE accounts (id int PRIMARY KEY, owner varchar(20) NOT NULL, balance int NOT NULL);
  INSERT INTO accounts VALUES (1, 'alice', 100);
sessions: [A, B]
steps:
  - A: BEGIN
  - A: SELECT * FROM accounts WHERE id = 1 FOR UPDATE
    tl: SELECT … FOR UPDATE (locks the row)

  - note: B's consistent SELECT does not request a record lock and completes while A holds its lock.
  - B: SELECT balance FROM accounts WHERE id = 1
    expect: [{ balance: 100 }]
    tl: consistent SELECT balance → 100

  - note: "Writing to it is another story: B's UPDATE must wait for A."
  - B: UPDATE accounts SET balance = balance - 10 WHERE id = 1
    blocks: p1
    tl: UPDATE -10

  - A: UPDATE accounts SET balance = 150 WHERE id = 1
  - A: COMMIT
    comment: releases the row lock
    tl: COMMIT (releases the lock)

  - success: p1
  - B: SELECT balance FROM accounts WHERE id = 1
    expect: [{ balance: 140 }]
    comment: B's -10 applied on top of A's committed 150
