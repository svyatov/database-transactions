title: "SKIP LOCKED: take what's free, skip what's taken"
claim: >-
  In this MySQL 8.4 InnoDB schedule, FOR UPDATE SKIP LOCKED selects
  different available job rows for A, B, and C; D finds none, then can select
  job 1 after A rolls back. This tests row selection and explicit rollback,
  not worker crashes or duplicate-free external execution.
setup: |
  CREATE TABLE jobs (id int PRIMARY KEY, task varchar(50) NOT NULL);
  INSERT INTO jobs VALUES (1, 'send email'), (2, 'resize image'), (3, 'build report');
sessions: [A, B, C, D]
steps:
  - note: Four sessions issue the same query in the order shown, with A, B, and C retaining their locks.
  - A: BEGIN
  - A: SELECT * FROM jobs ORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED
    expect: [{ id: 1 }]
    tl: grabs job 1

  - B: BEGIN
  - B: SELECT * FROM jobs ORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED
    expect: [{ id: 2 }]
    comment: job 1 is locked by A — skipped, no waiting
    tl: job 1 taken → grabs job 2

  - C: BEGIN
  - C: SELECT * FROM jobs ORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED
    expect: [{ id: 3 }]
    tl: grabs job 3

  - note: D finds no available row; the table still contains the locked jobs.
  - D: SELECT * FROM jobs ORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED
    expect: []
    tl: no available row → nothing

  - note: A explicitly rolls back, releasing its job-row lock. No crash is injected.
  - A: ROLLBACK
    tl: ROLLBACK → job 1 lock released
  - D: SELECT * FROM jobs ORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED
    expect: [{ id: 1 }]
    tl: grabs job 1

  - B: COMMIT
  - C: COMMIT
