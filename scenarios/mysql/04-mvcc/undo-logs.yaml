title: Old row versions live in the undo log
claim: >-
  At MySQL 8.4 InnoDB REPEATABLE READ, R's earlier read view still returns
  three rows after A commits their deletion and counts zero. R counts zero
  after ending its transaction. Undo reconstruction and deferred physical
  removal are documented mechanisms, not physical-page observations here.
setup: |
  CREATE TABLE accounts (id int PRIMARY KEY, owner varchar(20) NOT NULL, balance int NOT NULL);
  INSERT INTO accounts VALUES (1, 'alice', 100), (2, 'bob', 200), (3, 'carol', 300);
sessions: [A, R]
steps:
  - R: BEGIN
  - R: SELECT id, balance FROM accounts ORDER BY id
    expect: [{ id: 1, balance: 100 }, { id: 2, balance: 200 }, { id: 3, balance: 300 }]
    comment: the read view opens here
    tl: reads 3 rows — snapshot opens

  - note: A deletes and commits all three rows; its current SELECT counts zero, without inspecting physical storage.
  - A: DELETE FROM accounts
    affected: 3
    tl: DELETE all 3 (+ commit)
  - A: SELECT count(*) AS remaining FROM accounts
    expect: [{ remaining: 0 }]
    tl: table now empty

  - note: >-
      R's SELECT still returns three rows. The MySQL multi-versioning manual
      explains this using undo reconstruction; the SELECT asserts visibility,
      not a count of internal reconstruction operations.
  - R: SELECT id, balance FROM accounts ORDER BY id
    expect: [{ id: 1, balance: 100 }, { id: 2, balance: 200 }, { id: 3, balance: 300 }]
    comment: the prior read view still returns the original rows
    tl: still sees 3 rows (from undo)

  - R: COMMIT
    tl: COMMIT — snapshot released
  - R: SELECT count(*) AS remaining FROM accounts
    expect: [{ remaining: 0 }]
    comment: the read view is gone — and with it, R's claim on that history
    tl: now sees 0 too
