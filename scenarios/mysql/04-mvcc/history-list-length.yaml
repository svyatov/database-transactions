title: One idle reader, and history piles up
claim: >-
  On MySQL 8.4 InnoDB, R retains a REPEATABLE READ view at v=0 while
  200 single-row UPDATE transactions commit. The history-list counter is
  at least 200 and R still reads zero. The run does not measure retained bytes,
  an exact counter delta, or purge completion after R commits.
setup: |
  CREATE TABLE counters (id int PRIMARY KEY, v int NOT NULL);
  INSERT INTO counters VALUES (1, 0);
  CREATE PROCEDURE bump(n INT) BEGIN DECLARE i INT DEFAULT 0; WHILE i < n DO UPDATE counters SET v = v + 1 WHERE id = 1; SET i = i + 1; END WHILE; END;
sessions: [A, R]
steps:
  - note: R opens a read view — and then does nothing.
  - R: BEGIN
  - R: SELECT v FROM counters
    expect: [{ v: 0 }]
    tl: read view opens

  - note: >-
      Meanwhile the application hums along: 200 small transactions, each
      updating one row and committing. Every one of them must keep its undo —
      R's old read view prevents purge from advancing past the retained history.
  - A: CALL bump(200)
    comment: 200 committed single-row updates
    tl: 200 commits pile up undo

  - A: SELECT count >= 200 AS pinned_by_reader FROM information_schema.INNODB_METRICS WHERE name = 'trx_rseg_history_len'
    expect: [{ pinned_by_reader: 1 }]
    comment: the history-list counter is at least 200 while R retains its view
    tl: history_len ≥ 200 — pinned

  - R: SELECT v FROM counters
    expect: [{ v: 0 }]
    comment: R still reads its original world — that's what all that undo buys
    tl: R still sees v=0

  - R: COMMIT
    tl: COMMIT → purge can drain it
  - note: >-
      R's commit removes its read-view retention requirement. Background purge
      and other readers determine later cleanup; this run does not wait for
      or assert history-list drainage.
