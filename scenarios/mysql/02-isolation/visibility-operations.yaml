title: Reading one row with two operations
claim: >-
  In this InnoDB REPEATABLE READ schedule, A's consistent SELECT retains 100
  after B commits 150. SELECT FOR UPDATE returns 150 without refreshing the
  consistent-read view. A's UPDATE adds 50 to 150, and A reads its own 200
  while B still reads 150; after A commits, B reads 200.
isolation: REPEATABLE READ
setup: |
  CREATE TABLE accounts (id int PRIMARY KEY, balance int NOT NULL) ENGINE=InnoDB;
  INSERT INTO accounts VALUES (1, 100);
sessions: [A, B]
steps:
  - A: SET TRANSACTION ISOLATION LEVEL REPEATABLE READ
  - A: BEGIN
  - A: SELECT balance FROM accounts WHERE id = 1
    expect: [{ balance: 100 }]
    tl: Plain SELECT
  - B: UPDATE accounts SET balance = 150 WHERE id = 1
    affected: 1
    tl: UPDATE; autocommit
  - A: SELECT balance FROM accounts WHERE id = 1
    expect: [{ balance: 100 }]
    tl: Plain SELECT
  - A: SELECT balance FROM accounts WHERE id = 1 FOR UPDATE
    expect: [{ balance: 150 }]
    tl: Locking SELECT
  - A: SELECT balance FROM accounts WHERE id = 1
    expect: [{ balance: 100 }]
    tl: Plain SELECT after locking read
  - A: UPDATE accounts SET balance = balance + 50 WHERE id = 1
    affected: 1
  - A: SELECT balance FROM accounts WHERE id = 1
    expect: [{ balance: 200 }]
    tl: Plain SELECT after own UPDATE
  - B: SELECT balance FROM accounts WHERE id = 1
    expect: [{ balance: 150 }]
  - A: COMMIT
  - B: SELECT balance FROM accounts WHERE id = 1
    expect: [{ balance: 200 }]
