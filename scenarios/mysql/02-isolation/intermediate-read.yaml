title: READ UNCOMMITTED serves drafts absent from committed history
claim: >-
  At READ UNCOMMITTED a reader can observe an intermediate value the writer
  later overwrites before committing (Adya's G1b, "intermediate read"); a
  number absent from committed history. In the repeated READ COMMITTED
  schedule, B reads 110 while A's draft 555 is uncommitted.
anomaly: G1b
setup: |
  CREATE TABLE accounts (id int PRIMARY KEY, owner varchar(20) NOT NULL, balance int NOT NULL) ENGINE=InnoDB;
  INSERT INTO accounts VALUES (1, 'alice', 100);
sessions: [A, B]
steps:
  - note: A recalculates alice's balance in two steps. B watches at READ UNCOMMITTED.
  - B: SET SESSION TRANSACTION ISOLATION LEVEL READ UNCOMMITTED
  - B: BEGIN

  - A: BEGIN
  - A: UPDATE accounts SET balance = 999 WHERE id = 1
    comment: a working draft; A isn't done yet
    tl: UPDATE balance = 999 (a draft)

  - B: SELECT balance FROM accounts WHERE id = 1
    expect: [{ balance: 999 }]
    comment: B just read a draft
    tl: SELECT balance → 999 (reads the draft)

  - A: UPDATE accounts SET balance = 110 WHERE id = 1
    comment: A settles on the final value…
    tl: UPDATE balance = 110 (final value)
  - A: COMMIT
    tl: COMMIT

  - B: SELECT balance FROM accounts WHERE id = 1
    expect: [{ balance: 110 }]
    tl: SELECT balance → 110 (999 never committed)
  - B: COMMIT

  - note: >-
      The committed history is 100 → 110. B read 999 without executing any
      application action. At READ COMMITTED, B now excludes A's draft 555:
  - B: SET SESSION TRANSACTION ISOLATION LEVEL READ COMMITTED
  - B: BEGIN
  - A: BEGIN
  - A: UPDATE accounts SET balance = 555 WHERE id = 1
  - B: SELECT balance FROM accounts WHERE id = 1
    expect: [{ balance: 110 }]
    comment: no drafts served here
  - A: ROLLBACK
  - B: COMMIT
