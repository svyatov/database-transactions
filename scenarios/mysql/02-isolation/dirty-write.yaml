title: A second writer waits at READ UNCOMMITTED
claim: >-
  In this InnoDB READ UNCOMMITTED schedule, B's UPDATE of A's uncommitted
  row waits until A commits. Both of B's later prices are asserted after
  B commits. All-level dirty-write exclusion needs the row-lock contract.
anomaly: G0
isolation: READ UNCOMMITTED
setup: |
  CREATE TABLE items (id int PRIMARY KEY, name varchar(20) NOT NULL, price int NOT NULL) ENGINE=InnoDB;
  INSERT INTO items VALUES (1, 'mug', 10), (2, 'cap', 20);
sessions: [A, B]
steps:
  - note: >-
      Two batch jobs reprice the whole catalog concurrently at READ
      UNCOMMITTED. The dirty-write event would be overwriting A's uncommitted
      row; a mixed final state is not its definition.
  - A: SET SESSION TRANSACTION ISOLATION LEVEL READ UNCOMMITTED
  - B: SET SESSION TRANSACTION ISOLATION LEVEL READ UNCOMMITTED
  - A: BEGIN
  - B: BEGIN
  - A: UPDATE items SET price = 11 WHERE id = 1
    tl: UPDATE mug = 11

  - note: B may READ A's uncommitted rows at this level; but it may not overwrite them.
  - B: UPDATE items SET price = 12 WHERE id = 1
    blocks: p1
    tl: UPDATE mug = 12

  - A: UPDATE items SET price = 21 WHERE id = 2
    tl: UPDATE cap = 21
  - A: COMMIT
    comment: releases both row locks
    tl: COMMIT
  - success: p1

  - B: UPDATE items SET price = 22 WHERE id = 2
    tl: UPDATE cap = 22
  - B: COMMIT
    tl: COMMIT

  - A: SELECT id, price FROM items ORDER BY id
    expect: [{ id: 1, price: 12 }, { id: 2, price: 22 }]
    comment: both of B's prices in this schedule
    tl: SELECT → 12, 22 (both B)
