title: Counting an observed deadlock
claim: >-
  On MySQL 8.4 InnoDB with deadlock detection and the lock_deadlocks metric
  enabled, this opposite-order schedule raises 1213 and the server-wide
  counter increases by at least one. This is not a permanent incident record.
setup: |
  CREATE TABLE accounts (id int PRIMARY KEY, owner varchar(20) NOT NULL, balance int NOT NULL);
  INSERT INTO accounts VALUES (1, 'alice', 100), (2, 'bob', 100);
  -- Snapshot the counter now; the scenario asserts the delta.
  CREATE TABLE deadlocks_before AS
    SELECT count AS n FROM information_schema.INNODB_METRICS WHERE name = 'lock_deadlocks';
sessions: [A, B, M]
steps:
  - M: SELECT @@innodb_deadlock_detect AS detection
    expect: [{ detection: 1 }]
  - M: SELECT status FROM information_schema.INNODB_METRICS WHERE name = 'lock_deadlocks'
    expect: [{ status: enabled }]
  - note: The same two opposite-order transfers as chapter 3 — one will be the victim.
  - A: BEGIN
  - A: UPDATE accounts SET balance = balance - 10 WHERE id = 1
    tl: debit id=1
  - B: BEGIN
  - B: UPDATE accounts SET balance = balance - 25 WHERE id = 2
    tl: debit id=2

  - A: UPDATE accounts SET balance = balance + 10 WHERE id = 2
    blocks: p1
    tl: credit id=2
  - B.fails: UPDATE accounts SET balance = balance + 25 WHERE id = 1
    error: "1213"
    tl: credit id=1
  - success: p1
  - A: COMMIT

  - note: "The detected deadlock is also visible as a counter delta in this run:"
  - M: |
      SELECT im.count - b.n >= 1 AS deadlocks_since_snapshot
      FROM information_schema.INNODB_METRICS im, deadlocks_before b
      WHERE im.name = 'lock_deadlocks'
    expect: [{ deadlocks_since_snapshot: 1 }]
    comment: sample rates within one enabled interval; account for restart and reset

  - note: >-
      Documented separately: SHOW ENGINE INNODB STATUS reports the latest
      detected deadlock; innodb_print_all_deadlocks enables error-log reports.
      This scenario does not inspect either log output or retention.
