title: CREATE INDEX commits the preceding INSERT
claim: >-
  This CREATE INDEX implicitly commits the preceding InnoDB INSERT: B sees
  the order before A issues COMMIT, and a later ROLLBACK leaves it visible.
  This is one listed implicit-commit statement, not every kind of DDL.
setup: |
  CREATE TABLE orders (id int PRIMARY KEY, state varchar(10) NOT NULL);
sessions: [A, B]
steps:
  - note: >-
      A migration script wraps its work in a transaction, believing that makes
      it atomic: insert data, add an index, and if anything fails — roll back.
  - A: BEGIN
  - A: INSERT INTO orders VALUES (1, 'draft')
  - B: SELECT count(*) AS visible FROM orders
    expect: [{ visible: 0 }]
    comment: uncommitted, invisible — so far so good

  - A: CREATE INDEX idx_orders_state ON orders (state)
    comment: DDL — and an implicit COMMIT, right here

  - B: SELECT count(*) AS visible FROM orders
    expect: [{ visible: 1 }]
    comment: A never said COMMIT. The CREATE INDEX did.

  - note: >-
      A now explicitly rolls back. No migration exception is injected.
  - A: ROLLBACK
  - B: SELECT count(*) AS visible FROM orders
    expect: [{ visible: 1 }]
    comment: rolled back nothing — the INSERT was already committed

  - note: >-
      CREATE INDEX has already committed the INSERT. Check the manual's
      implicit-commit list and exceptions before relying on a migration
      wrapper; this schedule does not execute every DDL statement.
