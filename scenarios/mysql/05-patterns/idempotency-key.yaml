title: "Idempotency keys: duplicate requests skip a database charge"
claim: >-
  With retained primary keys and CLIENT_FOUND_ROWS absent, a committed
  duplicate and an in-flight duplicate each affect 0 rows after the original
  commits. The asserted balances show one database charge for each of the
  two keys; network response loss and remote charges are not executed.
setup: |
  CREATE TABLE payments (idempotency_key varchar(20) PRIMARY KEY, amount int NOT NULL);
  CREATE TABLE accounts (id int PRIMARY KEY, balance int NOT NULL);
  INSERT INTO accounts VALUES (1, 100);
sessions: [A, B]
steps:
  - note: The client sends 'charge $30' with idempotency key req-42. Server A processes it.
  - A: BEGIN
  - A: |-
      INSERT INTO payments VALUES ('req-42', 30)
      ON DUPLICATE KEY UPDATE amount = amount
    affected: 1
    comment: "1 row inserted: this key is new — do the work"
  - A: UPDATE accounts SET balance = balance - 30 WHERE id = 1
  - A: COMMIT

  - note: Model a same-key retry after commit. No network failure or application response is executed; B reads the stored amount.
  - B: BEGIN
  - B: |-
      INSERT INTO payments VALUES ('req-42', 30)
      ON DUPLICATE KEY UPDATE amount = amount
    affected: 0
    comment: "0 rows: existing key, skip the balance update; the next SELECT reads the stored amount"
  - B: SELECT amount FROM payments WHERE idempotency_key = 'req-42'
    expect: [{ amount: 30 }]
  - B: COMMIT

  - A: SELECT balance FROM accounts WHERE id = 1
    expect: [{ balance: 70 }]
    comment: charged exactly once

  - note: "The nasty case: the retry arrives while the original is still in flight, uncommitted."
  - A: BEGIN
  - A: |-
      INSERT INTO payments VALUES ('req-99', 25)
      ON DUPLICATE KEY UPDATE amount = amount
    affected: 1
  - A: UPDATE accounts SET balance = balance - 25 WHERE id = 1

  - B: |-
      INSERT INTO payments VALUES ('req-99', 25)
      ON DUPLICATE KEY UPDATE amount = amount
    blocks: p1

  - note: The unique index parks the retry until the original decides. A commits — the retry absorbs to 0 rows.
  - A: COMMIT
  - success: p1
    affected: 0
  - note: This in-flight duplicate affects 0 rows after A commits. No additional balance update is issued.

  - A: SELECT balance FROM accounts WHERE id = 1
    expect: [{ balance: 45 }]
    comment: "100 - 30 - 25: every charge applied exactly once"
