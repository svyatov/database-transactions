title: A job queue on FOR UPDATE SKIP LOCKED
claim: >-
  In this InnoDB schedule, B skips A's locked job and selects job 2. After an
  explicit rollback, B can select job 2 again; both database job states
  finish as done. No external work or process crash is executed.
setup: |
  CREATE TABLE jobs (id int PRIMARY KEY, task varchar(50) NOT NULL, state varchar(10) NOT NULL DEFAULT 'queued');
  INSERT INTO jobs (id, task) VALUES (1, 'send welcome email'), (2, 'generate invoice');
sessions: [A, B]
steps:
  - note: "Two sessions select the lowest available queued id under a row lock. Only database job-state changes are executed."
  - A: BEGIN
  - A: |-
      SELECT id, task FROM jobs WHERE state = 'queued'
      ORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED
    expect: [{ id: 1 }]
    tl: claim → job 1

  - B: BEGIN
  - B: |-
      SELECT id, task FROM jobs WHERE state = 'queued'
      ORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED
    expect: [{ id: 2 }]
    comment: job 1 is claimed — skipped without waiting
    tl: claim → job 2 (skips locked job 1)

  - note: A marks job 1 done and commits. B explicitly rolls back, releasing its claim on job 2.
  - A: UPDATE jobs SET state = 'done' WHERE id = 1
    tl: job 1 done
  - A: COMMIT
    tl: COMMIT
  - B: ROLLBACK
    tl: ROLLBACK → job 2 available

  - note: B starts a new transaction and selects job 2 again. No restarted process or external task execution is observed.
  - B: BEGIN
  - B: |-
      SELECT id, task FROM jobs WHERE state = 'queued'
      ORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED
    expect: [{ id: 2 }]
    tl: claim → job 2 (back in queue)
  - B: UPDATE jobs SET state = 'done' WHERE id = 2
    tl: job 2 done
  - B: COMMIT
    tl: COMMIT

  - A: SELECT id, state FROM jobs ORDER BY id
    expect: [{ id: 1, state: "done" }, { id: 2, state: "done" }]
    tl: both jobs done
