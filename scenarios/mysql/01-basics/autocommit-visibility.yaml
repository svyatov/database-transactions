title: Autocommit and visibility
claim: >-
  With autocommit=1 on InnoDB, A's successful standalone UPDATE is visible
  to B's later standalone SELECT. B excludes A's explicit-transaction UPDATE
  until COMMIT; a pre-existing REPEATABLE READ snapshot need not refresh.
setup: |
  CREATE TABLE accounts (id int PRIMARY KEY, owner varchar(20) NOT NULL, balance int NOT NULL) ENGINE=InnoDB;
  INSERT INTO accounts VALUES (1, 'alice', 100);
sessions: [A, B]
steps:
  - A: SELECT @@autocommit AS autocommit, @@transaction_isolation AS isolation, @@default_storage_engine AS engine
    expect: [{ autocommit: 1, isolation: REPEATABLE-READ, engine: InnoDB }]
  - B: SELECT @@autocommit AS autocommit
    expect: [{ autocommit: 1 }]
  - note: No BEGIN; the UPDATE is its own transaction, committed the instant it finishes.
  - A: UPDATE accounts SET balance = 150 WHERE id = 1
    tl: UPDATE balance = 150 (autocommit)

  - B: SELECT balance FROM accounts WHERE id = 1
    expect: [{ balance: 150 }]
    comment: B sees it immediately
    tl: SELECT balance → 150 (visible at once)

  - note: Inside an explicit transaction, A's change is invisible to B…
  - A: BEGIN
  - A: UPDATE accounts SET balance = 999 WHERE id = 1
    tl: UPDATE balance = 999 (uncommitted)

  - B: SELECT balance FROM accounts WHERE id = 1
    expect: [{ balance: 150 }]
    comment: still the old value
    tl: SELECT balance → 150 (A's change hidden)

  - note: B's next standalone SELECT takes a new snapshot after A commits.
  - A: COMMIT
    tl: COMMIT

  - B: SELECT balance FROM accounts WHERE id = 1
    expect: [{ balance: 999 }]
    tl: SELECT balance → 999 (now visible)
