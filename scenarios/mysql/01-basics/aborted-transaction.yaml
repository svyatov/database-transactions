title: A duplicate-key error leaves the InnoDB transaction open
claim: >-
  The demonstrated duplicate-key INSERT error (1062, without IGNORE) rolls
  back that statement; the earlier and later INSERTs commit in the same
  InnoDB transaction. This does not describe deadlock or connection errors.
setup: |
  CREATE TABLE items (id int PRIMARY KEY, name varchar(50) NOT NULL UNIQUE) ENGINE=InnoDB;
  INSERT INTO items VALUES (1, 'widget');
sessions: [A]
steps:
  - A: BEGIN
  - A: INSERT INTO items VALUES (2, 'gadget')

  - A.fails: INSERT INTO items VALUES (3, 'widget')
    error: "1062"
    comment: ER_DUP_ENTRY

  - note: This 1062 error leaves the earlier INSERT intact. A chooses to continue and COMMIT.
  - A: INSERT INTO items VALUES (3, 'doohickey')
  - A: COMMIT

  - A: SELECT id, name FROM items ORDER BY id
    expect:
      - { id: 1, name: widget }
      - { id: 2, name: gadget }
      - { id: 3, name: doohickey }
    comment: survived the error in the middle
