title: The dual-write problem
claim: >-
  Two modeled failure windows leave mismatched records: a committed order
  with no stand-in event, then an autocommitted stand-in event whose order
  fails with 3819. The broker is a local table, not an observed delivery service.
setup: |
  CREATE TABLE orders (id int PRIMARY KEY, customer varchar(20) NOT NULL, amount int NOT NULL CHECK (amount > 0));
  -- Database-local stand-in for a recipient, written outside the order transaction.
  -- No broker transport, consumer, or process crash is executed.
  CREATE TABLE broker (event varchar(50) NOT NULL);
sessions: [App]
steps:
  - note: Attempt 1 — write, then publish. The order commits…
  - App: BEGIN
  - App: INSERT INTO orders VALUES (1, 'alice', 90)
  - App: COMMIT
  - note: The stand-in publish is omitted after commit. This models a failure window without killing a process.
  - App: |-
      SELECT (SELECT count(*) FROM orders) AS orders,
             (SELECT count(*) FROM broker) AS events
    expect: [{ orders: 1, events: 0 }]

  - note: Attempt 2 writes a stand-in event in autocommit before attempting the order.
  - App: "INSERT INTO broker VALUES ('order_placed: order 2')"
  - note: The order INSERT fails its CHECK constraint with 3819. No timeout or crash is injected.
  - App.fails: INSERT INTO orders VALUES (2, 'mallory', -5)
    error: "3819"
    comment: ER_CHECK_CONSTRAINT_VIOLATED

  - note: The stand-in event exists without order 2. No downstream processing is observed.
  - App: |-
      SELECT (SELECT count(*) FROM orders WHERE id = 2) AS orders,
             (SELECT count(*) FROM broker WHERE event LIKE '%order 2%') AS events
    expect: [{ orders: 0, events: 1 }]
