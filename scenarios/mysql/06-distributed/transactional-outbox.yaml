title: The transactional outbox
claim: >-
  The committed attempt retains both order and outbox row; the rolled-back
  attempt retains neither. Rolling back the relay's DELETE makes the event
  selectable again, then a committed DELETE empties the outbox. No external
  publication, receiver effect, or process crash is executed.
setup: |
  CREATE TABLE orders (id int PRIMARY KEY, customer varchar(20) NOT NULL, amount int NOT NULL);
  CREATE TABLE outbox (id int AUTO_INCREMENT PRIMARY KEY, event varchar(50) NOT NULL);
sessions: [App, Relay]
steps:
  - note: The order and its event are written in ONE transaction — both land in the same database.
  - App: BEGIN
  - App: INSERT INTO orders VALUES (1, 'alice', 90)
  - App: "INSERT INTO outbox (event) VALUES ('order_placed: order 1')"
  - App: COMMIT
  - App: SELECT id FROM orders ORDER BY id
    expect: [{ id: 1 }]

  - note: "The second attempt explicitly rolls back. The next SELECTs assert that only order 1 and its outbox row remain."
  - App: BEGIN
  - App: INSERT INTO orders VALUES (2, 'bob', 75)
  - App: "INSERT INTO outbox (event) VALUES ('order_placed: order 2')"
  - App: ROLLBACK
  - App: SELECT id FROM orders ORDER BY id
    expect: [{ id: 1 }]
  - App: SELECT id, event FROM outbox ORDER BY id
    expect: [{ id: 1, event: "order_placed: order 1" }]

  - note: A relay claims the event exactly like a chapter-5 job-queue worker…
  - Relay: BEGIN
  - Relay: SELECT id, event FROM outbox ORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED
    expect: [{ id: 1, event: "order_placed: order 1" }]

  - note: The relay deletes the row and explicitly rolls back. Publication is omitted; no HTTP call or crash is executed.
  - Relay: DELETE FROM outbox WHERE id = 1
  - Relay: ROLLBACK

  - note: >-
      The rolled-back DELETE leaves the event available for reselection.
      A later relay transaction selects and deletes it again. This establishes
      database reselection, not redelivery to a recipient.
  - Relay: BEGIN
  - Relay: SELECT id, event FROM outbox ORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED
    expect: [{ id: 1, event: "order_placed: order 1" }]
  - Relay: DELETE FROM outbox WHERE id = 1
  - Relay: COMMIT

  - Relay: SELECT count(*) AS pending FROM outbox
    expect: [{ pending: 0 }]
